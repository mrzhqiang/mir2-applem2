[System]
; 启用新的升级属性成长体系
Enabled=true
; 不使用旧系统
UseOldSystem=false
; 配置版本号
ConfigVersion=v1.0

; ========== 战士职业配置（比例成长示例）==========
[Warrior]
Enabled=true

; HP成长配置 - 使用比例成长
HP_Enabled=true
HP_GrowthType=Percent
HP_FixedValue=0
; 每级增加基础HP的3%（30‰）
HP_PercentValue=30
; 基础HP值为200点
HP_BaseValue=200

; MP成长配置 - 使用固定数值成长
MP_Enabled=true
MP_GrowthType=Fixed
MP_FixedValue=5
MP_PercentValue=0
MP_BaseValue=0

; 物理攻击成长配置 - 使用比例成长
DC_Enabled=true
DC_GrowthType=Percent
DC_FixedValue=0
; 每级增加基础攻击的2%（20‰）
DC_PercentValue=20
; 基础攻击力为10点
DC_BaseValue=10

; 物理防御成长配置 - 使用固定数值成长
AC_Enabled=true
AC_GrowthType=Fixed
AC_FixedValue=2
AC_PercentValue=0
AC_BaseValue=0

; 其他属性不启用
MC_Enabled=false
SC_Enabled=false
MAC_Enabled=false

; ========== 法师职业配置（混合成长示例）==========
[Wizard]
Enabled=true

; HP成长配置 - 使用固定数值成长
HP_Enabled=true
HP_GrowthType=Fixed
HP_FixedValue=8
HP_PercentValue=0
HP_BaseValue=0

; MP成长配置 - 使用比例成长
MP_Enabled=true
MP_GrowthType=Percent
MP_FixedValue=0
; 每级增加基础MP的4%（40‰）
MP_PercentValue=40
; 基础MP值为150点
MP_BaseValue=150

; 魔法攻击成长配置 - 使用比例成长
MC_Enabled=true
MC_GrowthType=Percent
MC_FixedValue=0
; 每级增加基础魔攻的2.5%（25‰）
MC_PercentValue=25
; 基础魔法攻击力为12点
MC_BaseValue=12

; 其他属性不启用
DC_Enabled=false
SC_Enabled=false
AC_Enabled=false
MAC_Enabled=false

; ========== 道士职业配置（平衡成长示例）==========
[Taoist]
Enabled=true

; HP成长配置 - 使用比例成长
HP_Enabled=true
HP_GrowthType=Percent
HP_FixedValue=0
; 每级增加基础HP的2.5%（25‰）
HP_PercentValue=25
; 基础HP值为180点
HP_BaseValue=180

; MP成长配置 - 使用比例成长
MP_Enabled=true
MP_GrowthType=Percent
MP_FixedValue=0
; 每级增加基础MP的3%（30‰）
MP_PercentValue=30
; 基础MP值为120点
MP_BaseValue=120

; 道术攻击成长配置 - 使用比例成长
SC_Enabled=true
SC_GrowthType=Percent
SC_FixedValue=0
; 每级增加基础道术的2%（20‰）
SC_PercentValue=20
; 基础道术攻击力为11点
SC_BaseValue=11

; 魔法防御成长配置 - 使用固定数值成长
MAC_Enabled=true
MAC_GrowthType=Fixed
MAC_FixedValue=1
MAC_PercentValue=0
MAC_BaseValue=0

; 其他属性不启用
DC_Enabled=false
MC_Enabled=false
AC_Enabled=false

; ========== 成长效果说明 ==========
; 以战士为例（50级）：
; HP成长：基础200 + (200 * 30 * 50) / 1000 = 200 + 300 = 500点HP
; 攻击成长：基础10 + (10 * 20 * 50) / 1000 = 10 + 10 = 20点攻击
;
; 以法师为例（50级）：
; HP成长：基础14 + 8 * 50 = 414点HP（固定成长）
; MP成长：基础13 + (150 * 40 * 50) / 1000 = 13 + 300 = 313点MP
; 魔攻成长：基础0 + (12 * 25 * 50) / 1000 = 15点魔攻
;
; 以道士为例（50级）：
; HP成长：基础14 + (180 * 25 * 50) / 1000 = 14 + 225 = 239点HP
; MP成长：基础13 + (120 * 30 * 50) / 1000 = 13 + 180 = 193点MP
; 道术成长：基础0 + (11 * 20 * 50) / 1000 = 11点道术
