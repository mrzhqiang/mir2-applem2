[System]
; 启用经验加成系统
Enabled=true
; 开启全局叠加模式 - 所有加成都会累加计算
GlobalStackMode=true
; 最大加成限制为500%，防止加成过高
MaxBonusRate=500
; 默认VIP加成60%
DefaultVIPBonus=60
; 不允许负数加成
AllowNegativeBonus=false
; 最小加成0%
MinBonusRate=0
; 配置版本
ConfigVersion=v1.0

; ========== VIP加成配置 ==========
[VIP]
Enabled=true
MaxRate=100
MinRate=0
; VIP允许叠加（在叠加模式下）
AllowStack=true
MaxStackCount=1

; ========== 经验卡加成配置 ==========
[ExpCard]
Enabled=true
MaxRate=200
MinRate=0
; 经验卡允许叠加
AllowStack=true
MaxStackCount=5

; ========== 活动加成配置 ==========
[Event]
Enabled=true
MaxRate=150
MinRate=0
; 活动允许叠加
AllowStack=true
MaxStackCount=3

; ========== 行会加成配置 ==========
[Guild]
Enabled=true
MaxRate=50
MinRate=0
AllowStack=false
MaxStackCount=1

; ========== 地图加成配置 ==========
[Map]
Enabled=true
MaxRate=100
MinRate=-30
AllowStack=false
MaxStackCount=1

; ========== 物品加成配置 ==========
[Item]
Enabled=true
MaxRate=100
MinRate=0
AllowStack=true
MaxStackCount=3

; ========== 系统加成配置 ==========
[SystemBonus]
Enabled=true
MaxRate=200
MinRate=-50
AllowStack=true
MaxStackCount=2

; ========== 自定义加成配置 ==========
[Custom]
Enabled=true
MaxRate=300
MinRate=-100
AllowStack=true
MaxStackCount=5

; ========== 叠加模式示例说明 ==========
;
; 在此配置下，假设玩家同时拥有以下加成：
; - VIP会员: 60%
; - 经验卡1: 100%
; - 经验卡2: 200%
; - 活动加成: 50%
; - 行会加成: 30%
; - 地图加成: 20%
;
; 计算方式（GlobalStackMode=true）：
; 总加成 = 60% + 100% + 200% + 50% + 30% + 20% = 460%
; 但由于MaxBonusRate=500%，所以最终加成为460%
;
; 如果原始经验为1000，最终经验 = 1000 × (1 + 460/100) = 5600
;
; 对比替换模式（GlobalStackMode=false）：
; - VIP: 60%
; - 经验卡: 200% (高倍数覆盖100%)
; - 活动: 50%
; - 行会: 30%
; - 地图: 20%
; 总加成 = 60% + 200% + 50% + 30% + 20% = 360%
; 最终经验 = 1000 × (1 + 360/100) = 4600
