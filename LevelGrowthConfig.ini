; ========== 配置说明 ==========
; 1. 固定数值成长（Fixed）：
;    每升一级增加固定的属性点数
;    例如：HP_FixedValue=15 表示每级增加15点HP
;
; 2. 固定比例成长（Percent）：
;    基于基础值的固定比例成长
;    例如：HP_BaseValue=100, HP_PercentValue=50 表示基于100点HP，每级增加5%（50‰）
;    实际增长值 = (基础值 * 比例值 * 等级) / 1000
;
; 3. 职业差异化配置：
;    每个职业可以独立配置不同的属性成长
;    可以通过Enabled参数控制是否启用某个属性的成长
;
; 4. 系统兼容性：
;    当Enabled=false时，使用原有的属性成长系统
;    当UseOldSystem=true时，即使Enabled=true也会使用旧系统
