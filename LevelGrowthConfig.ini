[System]
; 是否启用新的升级属性成长体系
Enabled=false
; 是否使用旧系统（当Enabled=true时，此项为false表示使用新系统）
UseOldSystem=true
; 配置版本号
ConfigVersion=v1.0

; ========== 战士职业配置 ==========
[Warrior]
; 是否启用战士职业配置
Enabled=true

; HP成长配置
HP_Enabled=true
; 成长类型：Fixed=固定数值成长，Percent=固定比例成长
HP_GrowthType=Fixed
; 固定数值成长：每级增加的HP点数
HP_FixedValue=15
; 比例成长：千分比数值（如50表示5%）
HP_PercentValue=0
; 基础值：用于比例计算的基础HP值
HP_BaseValue=0

; MP成长配置
MP_Enabled=true
MP_GrowthType=Fixed
MP_FixedValue=5
MP_PercentValue=0
MP_BaseValue=0

; 物理攻击成长配置
DC_Enabled=true
DC_GrowthType=Fixed
DC_FixedValue=3
DC_PercentValue=0
DC_BaseValue=0

; 魔法攻击成长配置（战士不启用）
MC_Enabled=false
MC_GrowthType=Fixed
MC_FixedValue=0
MC_PercentValue=0
MC_BaseValue=0

; 道术攻击成长配置（战士不启用）
SC_Enabled=false
SC_GrowthType=Fixed
SC_FixedValue=0
SC_PercentValue=0
SC_BaseValue=0

; 物理防御成长配置
AC_Enabled=true
AC_GrowthType=Fixed
AC_FixedValue=2
AC_PercentValue=0
AC_BaseValue=0

; 魔法防御成长配置（战士不启用）
MAC_Enabled=false
MAC_GrowthType=Fixed
MAC_FixedValue=0
MAC_PercentValue=0
MAC_BaseValue=0

