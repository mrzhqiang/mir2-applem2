; ========== 配置说明 ==========
; 1. 固定数值成长（Fixed）：
;    每级增加固定的属性点数
;    例如：HP_FixedValue=15 表示每级增加15点HP
;
; 2. 固定比例成长（Percent）：
;    基于基础值的百分比成长
;    例如：HP_BaseValue=100, HP_PercentValue=50 表示每级增加基础HP的5%
;
; 3. 职业差异化配置：
;    每个职业可以独立配置不同的属性成长
;    战士：高HP、物理攻击、物理防御
;    法师：高MP、魔法攻击
;    道士：平衡HP/MP、道术攻击、魔法防御
;
; 4. 启用/禁用控制：
;    System.Enabled: 控制整个新系统的启用
;    System.UseOldSystem: 控制是否回退到旧系统
;    各职业的Enabled: 控制单个职业是否使用新配置
;    各属性的Enabled: 控制单个属性是否使用新成长方式
