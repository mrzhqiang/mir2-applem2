[System]
; 是否启用新的升级属性成长体系
Enabled=false
; 是否使用旧系统（true=使用旧系统，false=使用新系统）
UseOldSystem=true
; 配置版本号
ConfigVersion=v1.0

; ========== 战士职业配置 ==========
[Warrior]
; 是否启用战士职业配置
Enabled=true

; HP成长配置
HP_Enabled=true
; 成长类型：Fixed=固定数值成长，Percent=固定比例成长
HP_GrowthType=Fixed
; 固定数值：每级增加的HP点数
HP_FixedValue=15
; 比例数值：千分比（如50表示5%）
HP_PercentValue=0
; 基础值：用于比例计算的基础HP值
HP_BaseValue=0

; MP成长配置
