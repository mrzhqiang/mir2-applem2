[System]
; 是否启用经验加成系统
Enabled=true
; 全局叠加模式开关 (true=叠加计算, false=高倍数覆盖低倍数)
GlobalStackMode=false
; 最大加成百分比限制 (0=无限制)
MaxBonusRate=1000
; 默认VIP加成百分比
DefaultVIPBonus=60
; 是否允许负数加成 (经验惩罚)
AllowNegativeBonus=false
; 最小加成百分比
MinBonusRate=0
; 配置版本号
ConfigVersion=v1.0

; ========== VIP加成配置 ==========
[VIP]
; 是否启用VIP加成
Enabled=true
; VIP最大加成百分比
MaxRate=200
; VIP最小加成百分比
MinRate=0
; VIP是否允许叠加 (通常VIP不叠加)
AllowStack=false
; VIP最大叠加数量
MaxStackCount=1

; ========== 经验卡加成配置 ==========
[ExpCard]
; 是否启用经验卡加成
Enabled=true
; 经验卡最大加成百分比
MaxRate=500
; 经验卡最小加成百分比
MinRate=0
; 经验卡是否允许叠加
AllowStack=true
; 经验卡最大叠加数量
MaxStackCount=10

; ========== 活动加成配置 ==========
[Event]
; 是否启用活动加成
Enabled=true
; 活动最大加成百分比
MaxRate=300
; 活动最小加成百分比
MinRate=0
; 活动是否允许叠加
AllowStack=true
; 活动最大叠加数量
MaxStackCount=5

; ========== 行会加成配置 ==========
[Guild]
; 是否启用行会加成
Enabled=true
; 行会最大加成百分比
MaxRate=100
; 行会最小加成百分比
MinRate=0
; 行会是否允许叠加 (通常行会不叠加)
AllowStack=false
; 行会最大叠加数量
MaxStackCount=1

; ========== 地图加成配置 ==========
[Map]
; 是否启用地图加成
Enabled=true
; 地图最大加成百分比
MaxRate=200
; 地图最小加成百分比 (可以为负数表示惩罚)
MinRate=-50
; 地图是否允许叠加 (通常地图不叠加)
AllowStack=false
; 地图最大叠加数量
MaxStackCount=1

; ========== 物品加成配置 ==========
[Item]
; 是否启用物品加成
Enabled=true
; 物品最大加成百分比
MaxRate=300
; 物品最小加成百分比
MinRate=0
; 物品是否允许叠加
AllowStack=true
; 物品最大叠加数量
MaxStackCount=5

; ========== 系统加成配置 ==========
[SystemBonus]
; 是否启用系统加成
Enabled=true
; 系统最大加成百分比
MaxRate=500
; 系统最小加成百分比 (可以为负数表示惩罚)
MinRate=-100
; 系统是否允许叠加
AllowStack=true
; 系统最大叠加数量
MaxStackCount=3

; ========== 自定义加成配置 ==========
[Custom]
; 是否启用自定义加成
Enabled=true
; 自定义最大加成百分比
MaxRate=1000
; 自定义最小加成百分比 (可以为负数表示惩罚)
MinRate=-200
; 自定义是否允许叠加
AllowStack=true
; 自定义最大叠加数量
MaxStackCount=10

; ========== 配置说明 ==========
; 
; 1. 经验加成计算公式：
;    最终经验 = 原始经验 × (1 + 总加成百分比/100)
;    例如：原始经验1000，总加成160%，最终经验=1000×(1+160/100)=2600
;
; 2. 叠加模式说明：
;    - GlobalStackMode=true: 所有加成累加计算
;      例如：VIP60% + 经验卡200% + 活动100% = 360%总加成
;    - GlobalStackMode=false: 同类型以最高值为准，不同类型累加
;      例如：VIP60% + 经验卡200%(覆盖100%卡) + 活动100% = 360%总加成
;
; 3. 独立加成说明：
;    - 在使用AddExpBonus时设置boIndependent=true的加成，
;      不受GlobalStackMode影响，总是独立计算
;
; 4. 类型加成优先级：
;    - 独立加成 > 全局配置 > 类型配置
;
; 5. 使用示例：
;    - 添加VIP加成：AddExpBonus(ebt_VIP, 60, esm_Replace, 0, 'VIP会员')
;    - 添加经验卡：AddExpBonus(ebt_ExpCard, 200, esm_Stack, 3600000, '200%经验卡', true)
;    - 添加活动加成：AddExpBonus(ebt_Event, 100, esm_Stack, 7200000, '双倍经验活动')
